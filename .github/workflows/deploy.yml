name: Deploy to DigitalOcean App Platform

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install doctl
      uses: digitalocean/action-doctl@v2
      with:
        token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
    
    - name: Configure and verify doctl authentication
      run: |
        # Purpose: Ensure doctl is installed and authenticated before deployment
        doctl version
        doctl auth init -t "${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}"
        doctl account get
    
    # NOTE: Previous step name used a colon which triggered a YAML parse error in GitHub Actions on line 29.
    # Old line kept (commented) per project rules for traceability:
    # - name: Debug: List existing apps
    - name: Debug - List existing apps
      run: |
        # Purpose: Verify access to App Platform APIs and list current apps
        doctl apps list || (echo "doctl apps list failed"; exit 1)
    
    - name: Deploy to App Platform
      run: |
        # [Commented out] set -euxo pipefail
        # Reason: Using pipefail with grep can cause the step to exit when the app name is not found.
        # [Commented out] set -eux
        # Reason: The -u (nounset) option causes the script to exit on referencing undefined variables (e.g., 'target'); remove -u to allow robust error handling.
        set -ex
        
        # Target App Platform application name (used for ID detection)
        TARGET_NAME="n8n-app"
        
        # Replace secret placeholders in app.yaml using encrypted GitHub secrets at deploy time
        # SAFETY: Some secrets may contain special characters (/, \, |, &). Use a helper to escape for sed replacement.
        DB_PW='${{ secrets.DB_POSTGRESDB_PASSWORD }}'
        ENC_KEY='${{ secrets.N8N_ENCRYPTION_KEY }}'
        JWT_SECRET='${{ secrets.N8N_USER_MANAGEMENT_JWT_SECRET }}'
        
        # Fail fast with a clear message if any required secrets are missing
        if [ -z "${DB_PW}" ] || [ -z "${ENC_KEY}" ] || [ -z "${JWT_SECRET}" ]; then
          echo "Missing one or more GitHub secrets: DB_POSTGRESDB_PASSWORD, N8N_ENCRYPTION_KEY, N8N_USER_MANAGEMENT_JWT_SECRET";
          exit 1;
        fi

        # Helper: escape characters that are special in sed replacements
        escape_sed() { echo "$1" | sed -e 's/[\\/&|]/\\&/g'; }
        
        # [Commented out] sed -i "s/DB_POSTGRESDB_PASSWORD_PLACEHOLDER/${{ secrets.DB_POSTGRESDB_PASSWORD }}/g" app.yaml
        # [Commented out] sed -i "s/N8N_ENCRYPTION_KEY_PLACEHOLDER/${{ secrets.N8N_ENCRYPTION_KEY }}/g" app.yaml
        # [Commented out] sed -i "s/N8N_USER_MANAGEMENT_JWT_SECRET_PLACEHOLDER/${{ secrets.N8N_USER_MANAGEMENT_JWT_SECRET }}/g" app.yaml
        # Reason: The above lines can break when secrets contain '/'. Use '|' delimiter and proper escaping.
        sed -i "s|DB_POSTGRESDB_PASSWORD_PLACEHOLDER|$(escape_sed \"${DB_PW}\")|g" app.yaml
        sed -i "s|N8N_ENCRYPTION_KEY_PLACEHOLDER|$(escape_sed \"${ENC_KEY}\")|g" app.yaml
        sed -i "s|N8N_USER_MANAGEMENT_JWT_SECRET_PLACEHOLDER|$(escape_sed \"${JWT_SECRET}\")|g" app.yaml
        
        # Deploy or update the app
        # Determine APP_ID robustly without causing failure when not found
        APP_ID=$(doctl apps list --format ID,Spec.Name --no-header | awk -v target="${TARGET_NAME}" '$2==target{print $1; exit}' || true)
        if [ -n "${APP_ID}" ]; then
          echo "Existing app detected: ${APP_ID}. Updating..."
          doctl apps update "${APP_ID}" --spec app.yaml --verbose
        else
          echo "No existing app detected; attempting to create..."
          set +e
          CREATE_OUTPUT=$(doctl apps create --spec app.yaml --verbose 2>&1)
          CREATE_EXIT=$?
          set -e
          if [ ${CREATE_EXIT} -eq 0 ]; then
            echo "Create succeeded."
          else
            echo "Create failed with exit code ${CREATE_EXIT}. Output:" && echo "${CREATE_OUTPUT}"
            # Attempt update if the app with target name now exists (e.g., 409 conflict)
            APP_ID=$(doctl apps list --format ID,Spec.Name --no-header | awk -v target="${TARGET_NAME}" '$2==target{print $1; exit}' || true)
            if [ -n "${APP_ID}" ]; then
              echo "Create failed but app '${TARGET_NAME}' exists (ID=${APP_ID}). Attempting update..."
              doctl apps update "${APP_ID}" --spec app.yaml --verbose
            else
              echo "Create failed and no existing app named '${TARGET_NAME}' was found. Aborting."
              exit ${CREATE_EXIT}
            fi
          fi
        fi
    
    - name: Wait for deployment
      run: |
        echo "Waiting for deployment to complete..."
        sleep 60
        # Target App Platform application name
        TARGET_NAME="n8n-app"
        # Try to fetch recent deployments and show status for visibility
        APP_ID=$(doctl apps list --format ID,Spec.Name --no-header | awk -v target="${TARGET_NAME}" '$2==target{print $1; exit}' || true)
        if [ -n "$APP_ID" ]; then
          echo "Recent deployments for app $APP_ID:" && doctl apps list-deployments "$APP_ID" || true
        fi
    
    - name: Get app info and logs (best effort)
      run: |
        echo "App deployment status:"
        doctl apps list || true
        # Target App Platform application name
        TARGET_NAME="n8n-app"
        APP_ID=$(doctl apps list --format ID,Spec.Name --no-header | awk -v target="${TARGET_NAME}" '$2==target{print $1; exit}' || true)
        if [ -n "$APP_ID" ]; then
          echo "Fetching build logs for n8n-web component (if available)"
          doctl apps logs "$APP_ID" n8n-web --type build || true
          echo "Fetching deploy logs for n8n-web component (if available)"
          doctl apps logs "$APP_ID" n8n-web --type deploy || true
          echo "Fetching run logs for n8n-web component (if available)"
          doctl apps logs "$APP_ID" n8n-web --type run || true
        fi